header{background:#14172b;border:0;padding:12px 20px}h1{color:#fff;font-size:19px;letter-spacing:.2px}nav button{color:#aab0d0}nav button.on{background:#4f46e5;color:#fff}.rl{color:#aab0d0}.rl select{background:#232846;color:#fff;border-color:#363c63}.disc{background:none;text-align:center;padding:8px 16px 0}main{padding-top:16px}.card,.f,.item,.pv{border-radius:14px;box-shadow:0 1px 3px rgba(20,23,43,.07)}.item{transition:border-color .15s,transform .15s}.item:hover{transform:translateY(-1px)}button{border-radius:9px;font-weight:500}button.pri{background:linear-gradient(135deg,#4f46e5,#7c5cf0);border:0;padding:7px 14px}h3{font-size:16px;margin:0 0 8px}textarea,input,select{border-radius:9px}textarea:focus,input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}.f{border-left-width:5px}.callout{background:var(--ac2);border-color:transparent}.chip{font-weight:500}.tb{border-bottom:1px solid var(--bd);padding-bottom:6px}.tb button{border-radius:8px}</style></head><body>
<header><h1>🛡️ Brandwarden</h1><nav id="nav"></nav><div class="rl">Acting as <select id="role"><option>Creator</option><option>Manager</option><option>Reviewer</option></select></div></header>
<div class="disc">AI features are optional, labelled, and never change content without your click.</div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),KEY='bw2',TODAY=new Date().toISOString().slice(0,10);
const reE=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),cap=(m,g)=>/^[A-Z]/.test(m)&&g?g[0].toUpperCase()+g.slice(1):g,fmt=v=>Number(v).toLocaleString('en-US');
let S,SM=null,ui={tab:'content',role:'Creator',cur:null,sub:'check',dis:null,ai:{},aiAll:''};
function seed(){const A=['Agency A','Regional team','Marketing','Freelancer'],ev=[];[['G4.1','a',6],['G4.1','d',1],['G3.2','d',4],['G3.2','a',1],['G2.1','a',7],['G1.1','a',5],['G3.1','a',3],['G3.1','d',2],['G4.2','a',4],['G5.1','a',5],['G5.1','d',1],['G6.1','a',1]].forEach(([r,o,n])=>{for(let i=0;i<n;i++)ev.push({r,o,a:A[ev.length%4],seed:1})});
return{docs:[],ev,kb:{rules:[{id:'G1.1',t:'Product naming',d:'Always write “Lumio Insights” exactly. Never “Lumio Analytics”, “LumioInsights” or “Lumio insights”.'},{id:'G2.1',t:'Approved terminology',d:'Use the preferred terms in the glossary; avoid legacy or banned words.'},{id:'G3.1',t:'Tone: confident, not hype',d:'Plain and friendly. One exclamation mark at most. No ALL-CAPS emphasis. No hype words.'},{id:'G3.2',t:'Emoji',d:'No emoji in press releases or emails; at most two in social posts.'},{id:'G4.1',t:'Claims need evidence',d:'Superlatives and absolutes (best, #1, fastest, guaranteed, 100%) need an approved evidence record.'},{id:'G4.2',t:'Facts come from the fact sheet',d:'Prices, counts and metrics must match the approved fact sheet and be within their review date.'},{id:'G5.1',t:'Accessibility',d:'Images need alt text; link text must describe the target; sentences under 25 words; CamelCase hashtags.'},{id:'G6.1',t:'Confidentiality',d:'Never mention restricted codenames or unreleased work in public content.'}],
terms:[{bad:'cheap',good:'affordable'},{bad:'e-mail',good:'email'},{bad:'users',good:'members'},{bad:'synergy',good:'collaboration'},{bad:'utilize',good:'use'},{bad:'Lumio Analytics',good:'Lumio Insights'}],
facts:[{k:'Price (per month)',re:'\\$\\s?(\\d+(?:\\.\\d+)?)\\s?(?:\\/\\s?mo|per month|a month|\\/month)',v:'29',exp:'2027-03-31'},{k:'Customers',re:'(\\d[\\d,]*)\\+?\\s+(?:customers|teams)',v:'4000',exp:'2026-06-30'},{k:'Uptime %',re:'(\\d+(?:\\.\\d+)?)%\\s+uptime',v:'99.9',exp:'2027-01-31'},{k:'Integrations',re:'(\\d+)\\+?\\s+integrations',v:'40',exp:'2027-01-31'},{k:'Free trial (days)',re:'(\\d+)[- ]day (?:free )?trial',v:'14',exp:'2027-06-30'}],
evidence:['99.9% uptime: SLA report Q3 2026'],restricted:['Project Aurora']}}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed()}function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const RULE=id=>S.kb.rules.find(r=>r.id===id)||{id,t:'',d:''},D=()=>S.docs.find(x=>x.id===ui.cur),isEd=d=>ui.role==='Creator'&&['Draft','Changes requested'].includes(d.status);
function check(text,ch,dec){const F=[],K=S.kb;const add=(rule,cat,sev,m,why,fix,sug)=>F.push({rule,cat,sev,s:m.index,e:m.index+m[0].length,t:m[0],why,fix,sug});const each=(re,fn)=>{let m;while((m=re.exec(text))){fn(m);if(!m[0])re.lastIndex++}};
each(/\bLumio\s?insights?\b/gi,m=>{if(m[0]!=='Lumio Insights')add('G1.1','Terminology','med',m,`Product name is written “${m[0]}”.`,'Lumio Insights','Use the exact product name.')});
K.terms.forEach(t=>each(new RegExp('\\b'+reE(t.bad)+'\\b','gi'),m=>{if(m[0]!==t.good)add('G2.1','Terminology','low',m,`“${m[0]}” isn’t approved wording.`,cap(m[0],t.good),`Preferred term: “${t.good}”.`)}));
K.restricted.forEach(w=>each(new RegExp(reE(w),'gi'),m=>add('G6.1','Confidentiality','high',m,`“${m[0]}” is a restricted internal name and must not appear in public content.`,'','Remove this reference.')));
K.facts.forEach(f=>{let r;try{r=new RegExp(f.re,'gi')}catch(e){return}each(r,m=>{const ok=parseFloat(m[1].replace(/,/g,''))===parseFloat(f.v),ex=f.exp&&f.exp<TODAY;
if(!ok)add('G4.2','Facts','high',m,`States ${m[1]}, but the approved figure for “${f.k}” is ${fmt(f.v)}${ex?` (that fact entry expired ${f.exp}, so confirm with its owner)`:''}.`,m[0].replace(m[1],fmt(f.v)),`Use the approved figure (${fmt(f.v)}).`);
else if(ex)add('G4.2','Facts','med',m,`Matches the fact sheet, but the “${f.k}” entry expired on ${f.exp}.`,null,'Ask the fact owner to reconfirm before publishing.')})});
const CL={best:'great',fastest:'fast','world-class':'proven',unbeatable:'competitive',leading:'trusted',guaranteed:'designed to deliver',guarantee:'aim to deliver',guarantees:'aims to deliver','100%':'full','risk-free':'easy to try','number one':'a top','#1':'a top'};
each(/\bbest\b|\bfastest\b|world-class|unbeatable|\bleading\b|\bguarantee[sd]?\b|100%(?!\s+uptime)|risk-free|never fails?|number one|#1/gi,m=>{const k=m[0].toLowerCase(),hi=/guarantee|100%|risk-free|never/.test(k);add('G4.1','Claims',hi?'high':'med',m,`“${m[0]}” is an absolute or superlative claim with no approved evidence on file.${K.evidence.length?' Evidence on file: '+K.evidence.join('; ')+'.':''}`,CL[k]?cap(m[0],CL[k]):null,hi?'Needs an authorised reviewer: rephrase or attach evidence.':'Soften the wording, or get evidence approved.')});
let ex=0;each(/!/g,m=>{if(++ex>1)add('G3.1','Tone','low',m,'More than one exclamation mark; the voice is confident, not excitable.','.','Use a full stop.')});
each(/\b[A-Z]{4,}\b/g,m=>{if(['GDPR','SAAS','IMMEDIATE','RELEASE'].includes(m[0]))return;add('G3.1','Tone','low',m,`“${m[0]}” in capitals reads as shouting.`,m[0][0]+m[0].slice(1).toLowerCase(),'Use sentence case.')});
const HY={'game-changing':'useful',revolutionary:'new',supercharge:'speed up',revolutionize:'improve','cutting-edge':'modern'};each(/game-changing|revolutionary|supercharge|revolutionize|cutting-edge/gi,m=>add('G3.1','Tone','low',m,`“${m[0]}” is hype language the tone guide avoids.`,cap(m[0],HY[m[0].toLowerCase()]),'Describe the concrete benefit instead.'));
let em=0;const lim=ch==='Social post'?2:0;each(/\p{Extended_Pictographic}/gu,m=>{if(++em>lim)add('G3.2','Tone','low',m,ch==='Social post'?'More than two emoji in a social post.':`Emoji aren’t used in ${ch.toLowerCase()} content.`,'','Remove it.')});
each(/!\[\s*\]\([^)]*\)/g,m=>add('G5.1','Accessibility','med',m,'Image has no alt text, so screen-reader users get nothing.',m[0].replace(/!\[\s*\]/,'![Describe what the image shows]'),'Add a short description of the image.'));
each(/\[(click here|here|read more|learn more)\]\(/gi,m=>add('G5.1','Accessibility','med',m,`Link text “${m[1]}” says nothing out of context.`,null,'Name the destination, e.g. “see pricing”.'));
each(/#[a-z][a-z0-9]{7,}\b/g,m=>add('G5.1','Accessibility','low',m,'All-lowercase hashtags are hard for screen readers to pronounce.',/lumioinsights/i.test(m[0])?'#LumioInsights':null,'Use CamelCase.'));
each(/[^.!?\n]+[.!?]?/g,m=>{if(m[0].trim().split(/\s+/).length>25)add('G5.1','Accessibility','low',m,'Sentence is over 25 words, which is hard to read.',null,'Split it in two.')});
F.sort((a,b)=>a.s-b.s);const seen={};F.forEach((f,i)=>{f.i=i;let k=f.rule+':'+f.t.toLowerCase();seen[k]=(seen[k]||0)+1;f.key=k+(seen[k]>1?'#'+seen[k]:'');f.d=dec[f.key]});return F}
function flesch(t){const w=t.match(/[A-Za-z']+/g)||[];if(!w.length)return'–';const sn=Math.max(1,(t.match(/[.!?]+(\s|$)/g)||[]).length),sy=w.reduce((a,x)=>a+Math.max(1,(x.toLowerCase().replace(/e$/,'').match(/[aeiouy]+/g)||[]).length),0);return Math.round(206.835-1.015*w.length/sn-84.6*sy/w.length)}
const sent=(t,i)=>{let s=i;while(s>0&&!/[.!?\n]/.test(t[s-1]))s--;let e=i;while(e<t.length&&!/[.!?\n]/.test(t[e]))e++;if(e<t.length)e++;return[s,e]},redact=t=>S.kb.restricted.reduce((a,w)=>a.replace(new RegExp(reE(w),'gi'),'[RESTRICTED]'),t);
function diff(a,b){const x=a.split(/(\s+)/),y=b.split(/(\s+)/),n=x.length,m=y.length;if(n*m>60000)return esc(b);const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);let i=0,j=0,o='';while(i<n&&j<m){if(x[i]===y[j]){o+=esc(x[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1])o+='<del>'+esc(x[i++])+'</del>';else o+='<ins>'+esc(y[j++])+'</ins>'}while(i<n)o+='<del>'+esc(x[i++])+'</del>';while(j<m)o+='<ins>'+esc(y[j++])+'</ins>';return o}
const lg=(d,msg)=>d.log.push({ts:new Date().toISOString(),by:ui.role,msg}),when=t=>new Date(t).toLocaleString([], {dateStyle:'short',timeStyle:'short'}),chip=s=>`<span class="chip s-${s.replace(/\s/g,'')}">${s}</span>`;
function pushV(d,note){if(d.vs[d.vs.length-1].text!==d.draft){d.vs.push({text:d.draft,by:ui.role,ts:new Date().toISOString(),note});lg(d,'Saved version '+d.vs.length+': '+note)}}
const SAMPLES={a:{t:'LinkedIn launch post',c:'Social post',x:'🚀🎉🔥 Lumio Analytics is the BEST analytics tool on the market!!! Over 5,000 customers trust us, with 100% uptime guaranteed. Start for just $19/month and see why users love it. Built with Project Aurora. Details: [click here](https://lumio.example/pricing)\n\n![](dashboard.png)\n#lumioinsights'},
b:{t:'Integrations press release',c:'Press release',x:'FOR IMMEDIATE RELEASE\nLumio Insights now connects with 60+ integrations, a revolutionary step for teams that want to utilize their data. Customers get a 30-day free trial, and we offer cheap onboarding for every team. 🎉 Contact us by e-mail to learn more.'},
c:{t:'Pricing blog intro',c:'Blog',x:'Lumio Insights starts at $29 per month and includes a 14-day free trial. Teams use it to share dashboards with their members and connect 40+ integrations. Compare plans in our [pricing guide](https://lumio.example/pricing).'}};
function vNew(){return`<div class="card"><h3>New content</h3><div class="row">${Object.entries(SAMPLES).map(([k,s])=>`<button data-a="sample" data-k="${k}">Sample: ${s.t}</button>`).join('')}</div><input id="nt" placeholder="Title" style="width:60%"> <select id="nc"><option>Social post</option><option>Press release</option><option>Email</option><option>Blog</option></select><textarea id="nx" rows="9" placeholder="Paste text here (Markdown links and images are supported)"></textarea><div class="row"><button class="pri" data-a="create">Create draft &amp; run check</button></div></div>`}
function vContent(){const d=D();return`<div class="grid"><aside><button class="pri" data-a="new" style="width:100%">+ New content</button>${S.docs.map(x=>`<div class="item ${d&&d.id===x.id?'on':''}" data-a="open" data-k="${x.id}"><b>${esc(x.title)}</b><small>${x.ch} · ${chip(x.status)}</small></div>`).join('')}</aside><section>${d&&ui.cur!=='new'?vDoc(d):vNew()}</section></div>`}
function vDoc(d){const ed=isEd(d);return`<div class="card"><div class="fh"><h3 style="margin:0">${esc(d.title)}</h3>${chip(d.status)}${d.route&&d.status==='In review'?`<span class="tag">Routed to ${d.route}</span>`:''}</div>${ed?`<div class="row">Channel <select data-a="ch">${['Social post','Press release','Email','Blog'].map(c=>`<option ${c===d.ch?'selected':''}>${c}</option>`).join('')}</select></div>`:`<span class="mu">${d.ch} · v${d.vs.length}</span>`}</div>
<div class="tb"><button class="${ui.sub==='check'?'on':''}" data-a="sub" data-k="check">Check</button><button class="${ui.sub==='disc'?'on':''}" data-a="sub" data-k="disc">Review &amp; discussion (${d.cm.length})</button><button class="${ui.sub==='hist'?'on':''}" data-a="sub" data-k="hist">History (${d.vs.length})</button></div>
${ui.sub==='check'?`<div class="two"><div><textarea id="ta" rows="12" ${ed?'':'readonly'}>${esc(d.draft)}</textarea><div class="row">${ed?'<button data-a="save">Save version</button><button class="pri" data-a="submit">Submit for review</button>':''}${SM?'<button data-a="aiall">✨ AI messaging review</button>':''}</div>${!ed?``:''}<div class="stats" id="st"></div><b>Flagged text</b><div class="pv" id="pv"></div><div id="aia">${ui.aiAll?`<div class="callout"><b>AI-generated, advisory only</b><br>${esc(ui.aiAll)}</div>`:''}</div></div><div id="fnd"></div></div>`:ui.sub==='disc'?vDisc(d):vHist(d)}`}
function card(f,ed){const r=RULE(f.rule),a=ui.ai[f.key],hf=f.fix!==null&&f.fix!==undefined;return`<div class="f ${f.sev} ${f.d?'done':''}" id="f-${f.i}"><div class="fh"><b>${f.cat}</b><span class="sv">${{high:'High',med:'Medium',low:'Low'}[f.sev]}</span>${f.sev==='high'?'<span class="tag">Needs reviewer</span>':''}</div><p>“${esc(f.t.trim())}” — ${esc(f.why)}</p><p class="src">Rule <b>${f.rule}</b> · ${esc(r.t)}</p><p class="sug">${esc(f.sug)}${hf?` <code>${esc(f.t.trim())}</code> → <code>${esc(f.fix)||'(remove)'}</code>`:''}</p>
${f.d?`<p class="mu">Dismissed by ${f.d.by}: ${esc(f.d.reason)} ${ed?`<a href="#" data-a="undo" data-k="${esc(f.key)}">undo</a>`:''}</p>`:ed?(ui.dis===f.key?`<div class="row"><select id="dr"><option>Intentional / approved exception</option><option>Guideline unclear</option><option>False positive</option><option>Evidence exists elsewhere</option></select><input id="dn" placeholder="Optional note"><button data-a="disok" data-k="${esc(f.key)}">Confirm dismiss</button></div>`:`<div class="row">${hf?`<button class="ok" data-a="acc" data-k="${esc(f.key)}">Accept fix</button>`:''}<button data-a="dis" data-k="${esc(f.key)}">Dismiss…</button>${SM?`<button data-a="ai" data-k="${esc(f.key)}">✨ AI rewrite</button>`:''}</div>`):''}
${a?(a.loading?'<p class="mu">Asking Claude…</p>':a.err?`<p class="mu">${a.err}</p>`:`<div class="callout"><b>AI suggestion (generated by Claude)</b><br>${esc(a.txt)}<div class="row"><button class="ok" data-a="aiapply" data-k="${esc(f.key)}">Apply</button><button data-a="aino" data-k="${esc(f.key)}">Discard</button></div></div>`):''}</div>`}
function paint(){const d=D();if(!d||!$('#fnd'))return;const ta=$('#ta'),text=ta?ta.value:d.draft,F=check(text,d.ch,d.dec),ed=isEd(d);let o='',p=0;F.forEach(f=>{if(f.s<p)return;o+=esc(text.slice(p,f.s))+`<mark class="${f.d?'dm':f.sev}" data-a="jump" data-k="${f.i}">${esc(text.slice(f.s,f.e))}</mark>`;p=f.e});$('#pv').innerHTML=o+esc(text.slice(p));
const open=F.filter(f=>!f.d),c=s=>open.filter(f=>f.sev===s).length;$('#st').innerHTML=`<span>🔴 ${c('high')} high</span><span>🟠 ${c('med')} medium</span><span>🟢 ${c('low')} low</span><span>· ${F.length-open.length} dismissed</span><span>· Readability (Flesch) ${flesch(text)}</span>`;
$('#fnd').innerHTML=`<h3 style="margin:0 0 8px">Findings</h3>${F.length?F.map(f=>card(f,ed)).join(''):'<div class="card">✅ No issues found against the current guidelines and fact sheet.</div>'}`}
function vDisc(d){const F=check(d.draft,d.ch,d.dec),open=F.filter(f=>!f.d),dm=F.filter(f=>f.d),r=ui.role,ir=d.status==='In review';const canA=ir&&(r==='Reviewer'||(r==='Manager'&&d.route==='Manager'));
return`<div class="card"><b>Review summary (current text)</b><p>${open.length} open finding(s), ${dm.length} dismissed by the creator.${open.some(f=>f.sev==='high')||dm.some(f=>f.sev==='high')?' <span class="tag">High-risk items present: authorised reviewer required</span>':''}</p>${dm.map(f=>`<p class="src">Dismissed ${f.rule} “${esc(f.t.trim())}”: ${esc(f.d.reason)}</p>`).join('')}${open.map(f=>`<p class="src">Open ${f.sev} · ${f.rule} “${esc(f.t.trim())}”</p>`).join('')}</div>
<div class="card"><b>Discussion</b>${d.cm.map(c=>`<p><b>${c.by}</b> <span class="mu">${when(c.ts)}</span><br>${esc(c.txt)}</p>`).join('')||'<p class="mu">No comments yet.</p>'}<textarea id="cm" rows="2" placeholder="Add a comment (required to request changes)"></textarea><div class="row"><button data-a="post">Post comment</button>${ir&&r==='Manager'&&d.route==='Manager'?'<button data-a="esc">Escalate to Reviewer</button>':''}${ir?`<button class="ok" data-a="approve" ${canA?'':'disabled'}>Approve</button><button class="no" data-a="chg" ${r==='Creator'?'disabled':''}>Request changes</button>`:''}</div>
<p class="mu">${!ir?(d.status==='Approved'?`Approved by ${d.appr.by} on ${when(d.appr.ts)} (version ${d.appr.v}).`:'Submit the draft for review to start approval.'):r==='Creator'?'Switch to Manager or Reviewer to review this item.':!canA?'This item contains high-risk findings; only an authorised Reviewer can approve it.':''}</p></div>`}
function vHist(d){const n=d.vs.length;return`<div class="card"><b>Versions</b>${d.vs.map((v,i)=>({v,i})).reverse().map(({v,i})=>`<p><b>v${i+1}</b> · ${v.by} · ${when(v.ts)} · ${esc(v.note)}</p><div class="pv">${i?diff(d.vs[i-1].text,v.text):esc(v.text)}</div>`).join('')}</div><div class="card"><b>Audit log</b>${d.log.slice().reverse().map(l=>`<p class="src">${when(l.ts)} · ${l.by} · ${esc(l.msg)}</p>`).join('')}</div>`}
function vKB(){const K=S.kb;return`<div class="card"><h3>Guidelines (source of every finding)</h3>${K.rules.map(r=>`<p><b>${r.id} ${esc(r.t)}</b><br><span class="mu">${esc(r.d)}</span></p>`).join('')}</div>
<div class="card"><h3>Terminology</h3><table>${K.terms.map((t,i)=>`<tr><td>${esc(t.bad)}</td><td>→ ${esc(t.good)}</td><td><button data-a="delt" data-k="${i}">Remove</button></td></tr>`).join('')}</table><div class="row"><input id="tb" placeholder="Avoid"><input id="tg" placeholder="Prefer"><button data-a="addt">Add term</button></div></div>
<div class="card"><h3>Approved facts</h3><table><tr><th>Fact</th><th>Approved value</th><th>Review by</th></tr>${K.facts.map((f,i)=>`<tr><td>${esc(f.k)}</td><td><input data-a="fv" data-k="${i}" data-f="v" value="${esc(f.v)}" size="6"></td><td><input type="date" data-a="fv" data-k="${i}" data-f="exp" value="${f.exp}"> ${f.exp<TODAY?'<span class="tag">expired</span>':''}</td></tr>`).join('')}</table><p class="mu">Evidence on file: ${K.evidence.map(esc).join('; ')}</p></div>
<div class="card"><h3>Restricted names (never public, never sent to AI)</h3><div class="row">${K.restricted.map((r,i)=>`<span class="chip">${esc(r)} <a href="#" data-a="delr" data-k="${i}">×</a></span>`).join('')}</div><div class="row"><input id="rn" placeholder="Codename"><button data-a="addr">Add</button></div><button data-a="reset">Reset demo data</button></div>`}
function vIns(){const ev=S.ev.slice(),R={},Au={};S.docs.forEach(d=>Object.entries(d.dec).forEach(([k,v])=>ev.push({r:k.split(':')[0],o:'d',a:'You'})));ev.forEach(e=>{const r=R[e.r]=R[e.r]||{a:0,d:0,o:0};r[e.o]++;Au[e.a||'You']=(Au[e.a||'You']||0)+1});
const rows=Object.entries(R).map(([id,r])=>({id,...r,n:r.a+r.d+r.o,dr:r.a+r.d?r.d/(r.a+r.d):0})).sort((a,b)=>b.n-a.n),mx=Math.max(1,...rows.map(r=>r.n));
return`<div class="card"><h3>Recurring issues</h3><p class="mu">Includes ${S.ev.filter(e=>e.seed).length} sample historical events.</p><table><tr><th>Rule</th><th>Flagged</th><th>Accepted</th><th>Dismissed</th></tr>${rows.map(r=>`<tr><td>${r.id} ${esc(RULE(r.id).t)}</td><td><span class="bar" style="width:${r.n/mx*120}px"></span> ${r.n}</td><td>${r.a}</td><td>${r.d} (${Math.round(r.dr*100)}%)</td></tr>`).join('')}</table></div>
<div class="card"><h3>Guidelines that may be unclear</h3>${rows.filter(r=>r.a+r.d>=3&&r.dr>=.5).map(r=>`<div class="callout"><b>${r.id} ${esc(RULE(r.id).t)}</b>: dismissed ${Math.round(r.dr*100)}% of the time. Consider clarifying it.</div>`).join('')||'<p class="mu">No rule is being dismissed more than half the time.</p>'}</div>
<div class="card"><h3>Findings by source</h3><table>${Object.entries(Au).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<tr><td>${esc(a)}</td><td>${n}</td></tr>`).join('')}</table></div>`}
function render(){$('#nav').innerHTML=[['content','Content'],['kb','Knowledge base'],['ins','Insights']].map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-a="tab" data-k="${k}">${l}</button>`).join('');$('#app').innerHTML=ui.tab==='kb'?vKB():ui.tab==='ins'?vIns():vContent();if(ui.tab==='content'&&ui.sub==='check')paint()}
const ask=async(p)=>(await SM(p,{modelTier:'quick',cache:false})).text.trim();
const A={tab:k=>{ui.tab=k;render()},new:()=>{ui.cur='new';render()},open:k=>{ui.cur=k;ui.sub='check';ui.dis=null;ui.aiAll='';render()},sub:k=>{ui.sub=k;render()},
sample:k=>{const s=SAMPLES[k];$('#nt').value=s.t;$('#nc').value=s.c;$('#nx').value=s.x},
create:()=>{const x=$('#nx').value.trim();if(!x){$('#nx').focus();return}const d={id:'d'+Date.now(),title:$('#nt').value||'Untitled',ch:$('#nc').value,status:'Draft',draft:x,vs:[{text:x,by:'Creator',ts:new Date().toISOString(),note:'Initial draft'}],dec:{},cm:[],log:[]};lg(d,'Created draft');S.docs.unshift(d);ui.cur=d.id;ui.sub='check';save();render()},
ch:(k,t)=>{const d=D();d.ch=t.value;save();paint()},save:()=>{const d=D();pushV(d,'Manual edit');save();render()},
submit:()=>{const d=D(),F=check(d.draft,d.ch,d.dec);pushV(d,'Submitted version');d.route=F.some(f=>f.sev==='high')?'Reviewer':'Manager';d.status='In review';F.filter(f=>!f.d).forEach(f=>S.ev.push({r:f.rule,o:'o',a:'You'}));lg(d,`Submitted for review, routed to ${d.route} (${F.filter(f=>!f.d).length} open findings)`);save();ui.sub='disc';render()},
dis:k=>{ui.dis=k;paint()},undo:(k,t,e)=>{e.preventDefault();delete D().dec[k];save();paint()},disok:k=>{const d=D();d.dec[k]={reason:$('#dr').value+($('#dn').value?' – '+$('#dn').value:''),by:ui.role,ts:new Date().toISOString()};S.ev.push({r:k.split(':')[0],o:'d',a:'You',x:1});S.ev.pop();lg(d,'Dismissed '+k.split(':')[0]+': '+d.dec[k].reason);ui.dis=null;save();paint()},
acc:k=>{const d=D(),f=check(d.draft,d.ch,d.dec).find(x=>x.key===k);if(!f)return;d.draft=d.draft.slice(0,f.s)+f.fix+d.draft.slice(f.e);S.ev.push({r:f.rule,o:'a',a:'You'});pushV(d,'Accepted fix for '+f.rule);save();render()},
jump:k=>{const e=$('#f-'+k);e&&e.scrollIntoView({behavior:'smooth',block:'center'})},
ai:async k=>{const d=D(),f=check(d.draft,d.ch,d.dec).find(x=>x.key===k),sp=sent(d.draft,f.s),orig=d.draft.slice(sp[0],sp[1]),r=RULE(f.rule);ui.ai[k]={loading:1};paint();try{const t=await ask(`You are a brand editor for the company Lumio. Rewrite ONLY the passage below to fix the issue while preserving the author’s intent and meaning. Do not invent facts or numbers. Return only the rewritten passage, nothing else.\nIssue: ${f.why}\nRule ${r.id}: ${r.d}\nApproved facts: ${S.kb.facts.map(x=>x.k+' = '+fmt(x.v)).join(', ')}\nPassage: ${redact(orig)}`);ui.ai[k]={txt:t,sp,orig}}catch(e){ui.ai[k]={err:e&&e.code==='not_granted'?'AI access was declined.':'AI is unavailable right now.'}}paint()},
aiapply:k=>{const d=D(),a=ui.ai[k];if(d.draft.slice(a.sp[0],a.sp[1])!==a.orig){a.err='The text changed; re-run the AI rewrite.';delete a.txt;paint();return}const l=a.orig.match(/^\s*/)[0],tr=a.orig.match(/\s*$/)[0];d.draft=d.draft.slice(0,a.sp[0])+l+a.txt+tr+d.draft.slice(a.sp[1]);delete ui.ai[k];pushV(d,'Applied AI rewrite (accepted by human)');save();render()},aino:k=>{delete ui.ai[k];paint()},
aiall:async()=>{const d=D();ui.aiAll='Asking Claude…';$('#aia').innerHTML='<p class="mu">Asking Claude…</p>';try{ui.aiAll=await ask(`You are a brand reviewer for Lumio (friendly, plain, confident, not hype). Review this ${d.ch} for messaging and tone problems that simple rules would miss (unclear value, mixed audience, off-voice phrasing). Give at most 4 short bullet points and quote the relevant words. Do not rewrite everything.\nGuidelines: ${S.kb.rules.map(r=>r.id+' '+r.d).join(' | ')}\nText: ${redact(d.draft)}`)}catch(e){ui.aiAll='AI is unavailable right now.'}render()},
post:()=>{const d=D(),t=$('#cm').value.trim();if(!t)return;d.cm.push({by:ui.role,ts:new Date().toISOString(),txt:t});lg(d,'Comment posted');save();render()},
esc:()=>{const d=D();d.route='Reviewer';lg(d,'Escalated to Reviewer');save();render()},
chg:()=>{const d=D(),t=$('#cm').value.trim();if(!t){$('#cm').placeholder='Please explain what to change first.';$('#cm').focus();return}d.cm.push({by:ui.role,ts:new Date().toISOString(),txt:t});d.status='Changes requested';lg(d,'Requested changes');save();render()},
approve:()=>{const d=D(),t=$('#cm').value.trim();if(t)d.cm.push({by:ui.role,ts:new Date().toISOString(),txt:t});d.status='Approved';d.appr={by:ui.role,ts:new Date().toISOString(),v:d.vs.length};lg(d,'Approved version '+d.vs.length);save();render()},
delt:k=>{S.kb.terms.splice(k,1);save();render()},addt:()=>{const b=$('#tb').value.trim(),g=$('#tg').value.trim();if(b&&g){S.kb.terms.push({bad:b,good:g});save();render()}},addr:()=>{const r=$('#rn').value.trim();if(r){S.kb.restricted.push(r);save();render()}},delr:(k,t,e)=>{e.preventDefault();S.kb.restricted.splice(k,1);save();render()},reset:()=>{S=seed();ui.cur=null;save();render()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||t.tagName==='INPUT')return;const f=A[t.dataset.a];f&&f(t.dataset.k,t,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='role'){ui.role=t.value;ui.dis=null;render();return}if(t.dataset.a==='ch')A.ch(null,t);if(t.dataset.a==='fv'){S.kb.facts[t.dataset.k][t.dataset.f]=t.value;save();if(t.dataset.f==='exp')render()}});
let tm;document.addEventListener('input',e=>{if(e.target.id==='ta'){const d=D();d.draft=e.target.value;clearTimeout(tm);tm=setTimeout(()=>{save();paint()},250)}});
load();render();(async()=>{try{SM=await window.claude.use('sample')}catch(e){}if(SM&&!(document.activeElement&&document.activeElement.id==='ta'))render()})();
</script></body></html>
